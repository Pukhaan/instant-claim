# fly.toml for teller-api
# https://fly.io/docs/reference/configuration/

app = "teller-api"
primary_region = "ams"

[build]
  dockerfile = "Dockerfile"

[env]
  STATE_DIR = "/app/state"
  BUNQ_SANDBOX = "true"
  ANTHROPIC_MODEL = "claude-sonnet-4-5"
  API_PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

[[mounts]]
  source = "teller_state"
  destination = "/app/state"
  initial_size = "1gb"
